apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argo/yellow
    repoURL: https://github.com/jpetazzo/2026-05-hi5
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
