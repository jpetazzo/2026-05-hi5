apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helmcoins-redis
  namespace: argocd
spec:
  destination:
    namespace: argo-helmcoins
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      releaseName: redis
      valuesObject:
        image:
          repository: redis
          tag: latest
        service:
          port: 6379
    path: charts/generic
    repoURL: https://github.com/jpetazzo/2026-05-hi5
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
